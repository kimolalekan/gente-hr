# Single-package workspace — the app lives at the repository root.
packages:
  - "."

# pnpm build-script approvals (postinstall scripts that are allowed to run).
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - esbuild@0.24.3
  - drizzle-orm@0.45.2
  - postcss@8.5.10
  - sharp@0.35.0
  - postcss@8.5.12
  - postcss@8.5.23
  - postcss@8.5.18
overrides:
  drizzle-orm@<0.45.2: ^0.45.2
  # 0.24.3 was never published; 0.25.x is the first patched release above the
  # vulnerable 0.24.x line.
  esbuild@<=0.24.2: ^0.25.0
  postcss@<8.5.10: ^8.5.10
  postcss@<=8.5.11: ^8.5.12
  postcss@<=8.5.17: ^8.5.18
  postcss@<=8.5.22: ^8.5.23
  sharp@<0.35.0: ^0.35.0
