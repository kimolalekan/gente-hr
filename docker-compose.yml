# Local development database (OTP login requires Postgres — no in-memory fallback).
services:
  db:
    image: postgres:16-alpine
    container_name: gente-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gente
    ports:
      - "5432:5432"
    volumes:
      - gente-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gente"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  gente-pgdata:
